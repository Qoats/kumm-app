# Application web Kumm (app.kumm.fr) sur GitHub Pages.
#
# Ce dépôt ne contient pas de code : il construit l'application à partir du code public de Qoats/Kumm, ajoute les
# horaires théoriques ouverts de transport.data.gouv.fr (CTS : Licence Ouverte 2.0, SNCF : ODbL) et publie le tout.
# Aucune API de la CTS, aucun jeton, aucun temps réel. Il n'a besoin d'aucun secret.
#
# Il se relance chaque jour (nouveaux horaires et dernier code de Qoats/Kumm), à la demande, et quand ce fichier change.
# Si une archive d'horaires manque ou est invalide, la construction échoue et le site en ligne reste inchangé.
name: Application web (GitHub Pages)

on:
  schedule:
    - cron: "37 5 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branche, étiquette ou commit de Qoats/Kumm à construire"
        type: string
        default: main

permissions:
  contents: read

jobs:
  construction:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          repository: Qoats/Kumm
          ref: ${{ inputs.ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Application (mode statique) + horaires ouverts dans dist/pages
      - run: npm run build:pages
      - name: Domaine et page d'erreur
        run: |
          printf 'app.kumm.fr\n' > dist/pages/CNAME
          cp dist/pages/index.html dist/pages/404.html
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist/pages

  deploiement:
    needs: construction
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
